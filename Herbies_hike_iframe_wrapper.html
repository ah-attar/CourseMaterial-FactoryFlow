<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Herbie's Hike</title>

  <style>
    :root {
      --background: #070707;
      --surface: #111111;
      --surface-soft: #181818;
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --accent: #d7b56d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      padding: 18px;
      background:
        radial-gradient(circle at top left, rgba(215, 181, 109, 0.09), transparent 32%),
        linear-gradient(180deg, #090909 0%, #050505 100%);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 4px 16px;
    }

    .brand {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 650;
      letter-spacing: -0.035em;
    }

    .open-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 160ms ease, border-color 160ms ease,
        transform 160ms ease;
    }

    .open-button:hover {
      border-color: rgba(215, 181, 109, 0.55);
      background: #202020;
      transform: translateY(-1px);
    }

    .open-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .app-frame {
      flex: 1;
      min-height: 760px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.48);
    }

    .app-frame iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 145px);
      min-height: 760px;
      border: 0;
      background: #ffffff;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 4px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .footer p {
      margin: 0;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .page-shell {
        padding: 12px;
      }

      .topbar {
        align-items: flex-start;
        padding-bottom: 12px;
      }

      .open-button {
        padding: 0 13px;
        font-size: 12px;
      }

      .app-frame {
        min-height: 780px;
        border-radius: 13px;
      }

      .app-frame iframe {
        height: calc(100vh - 130px);
        min-height: 780px;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">Interactive learning experience</p>
        <h1>Herbie's Hike</h1>
      </div>

      <a
        class="open-button"
        href="https://toc-dbr.onrender.com/"
        target="_blank"
        rel="noopener noreferrer">
        Open full screen
      </a>
    </header>

    <main class="app-frame">
      <iframe
        src="https://toc-dbr.onrender.com/"
        title="Herbie's Hike"
        loading="eager"
        allowfullscreen>
      </iframe>
    </main>

    <footer class="footer">
      <p>Created by AMIC, Queen's Belfast</p>
      <p>
        Having trouble viewing the app?
        <a
          href="https://toc-dbr.onrender.com/"
          target="_blank"
          rel="noopener noreferrer">
          Open it in a new window
        </a>
      </p>
    </footer>
  </div>
</body>
</html>
